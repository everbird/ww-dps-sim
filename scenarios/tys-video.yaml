# 全 4 星桃祈 · 渊武 · 散华（桃渊散）"深塔左四"一整局（B 站 BV1o7kfBPE6y，你自己的录像，Evariste 账号，2025-11-09 录的）。
# 不是总结出来的轴，是照录像把整局打了什么一段段记下来（2026-10-25），给视图 F（对视频）拿视频对时间轴用：每段（一次切人）一行，
# video.marks 是这段在视频里开始的时刻（切人那一下）。确认清单与怎么记的见 docs/tys-confirm.md。
# 记法：每 0.5 秒看一次画面上方的计时器、当前角色的生命上限（桃祈 15047 / 渊武 13985 / 散华 16280）和技能栏的冷却数字：
#   E / 大招 / 声骸冷却跳满的那一刻就是放了，冷却数字倒推出时刻；大招有过场动画。
#   普攻、重击打了几段看不清：按这段的长短和角色的打法估（桃祈 A4 换刚柔化势 → 后发制人 → 御反之隙），以后可以逐帧补；
#   大招前写了补位（A1~ A2~ A3~ A4~）：仿真里能量不够才打，补了几下就是仿真比录像少回的能量。
#   每段末尾"at <世界秒>"把下一次切人对到录像的时刻（世界秒 = 视频秒 − 10.8），前面的补位一直打到那时；
#   仿真比录像慢的段（动作做不完）at 不起作用，pnpm trace 的"对照视频"列出慢多少。
#   rotation 是按段表生成的（段表就是每行末尾的注释：视频秒、谁、打了什么），手改时 at 与 marks 的行号要跟着对。
# 配装照视频结尾（一年前）：库存里还在的声骸 id 见 docs/team3-candidates.md。散华首位的异构武装不在声骸表里，只算词条与套装，
# 视频里散华放的声骸技能（58.2 秒那次）没法记，跳过。敌人见 enemy 一行。
