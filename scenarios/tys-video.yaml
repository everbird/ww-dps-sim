# 全 4 星桃祈 · 渊武 · 散华（桃渊散）深塔 28 期左 4 一整局（B 站 BV1o7kfBPE6y，你自己的录像，Evariste 账号，2025-11-09 录的，满三星、剩 3:03）。
# 录像剖析（purpose: replay），不是轴教学：照录像把整局打了什么一段段记下来，用时间轴和各种状态（能量、协奏、共鸣回路、buff、冷却）
# 从数值上看懂这一局；敌人走位、出招不建模，DPS 只作参考。给视图 F（对视频）用：每段（一次切人）一行，
# video.marks 是这段在视频里开始的时刻（切人那一下）。确认清单与怎么记的见 docs/tys-confirm.md。
# 记法（2026-10-26 逐帧重记，每秒 4 格、关键处 10 格）：看画面上方的计时器、当前角色的生命上限（桃祈 15047 / 渊武 13985 / 散华 16280）和技能栏：
#   切人 = 生命上限变的那一格；是不是变奏看切人前生命条左边的协奏环满没满（录像为准，仿真协奏没满时记警告）；E / 声骸 = 冷却数字刚出现（倒推 0.1 秒）；大招 = 计时器停走（过场动画）前的那一刻，按停住的读数推算。
#   读出来的 E / 大招 / 声骸都用"at <世界秒>"钉到录像的时刻（世界秒 = 视频秒 − 10.8），前面的补位一直打到那时；
#   普攻、重击打了几段看不清：按这段的长短和角色的打法估（桃祈 A4 换刚柔化势 → 后发制人 → 御反之隙）。
#   大招前写了补位（A1~ A2~ A3~ A4~）：仿真里能量不够才打，补了几下就是仿真比录像少回的能量；最后两个大招仿真里能量不够，写成可选。
#   仿真比录像慢的段（动作做不完）at 不起作用，视图 F 与 pnpm trace 的"对照视频"列出慢多少。
#   rotation 是按段表生成的（段表就是每行末尾的注释：视频秒、谁、打了什么），手改时 at 与 marks 的行号要跟着对。
# 开头到 54 秒打的是两只小怪，55 秒叹息古龙的血条才出现、157.1 打死（战斗约 117 秒）。仿真只有一个敌人，从第 0 帧就打它，
# 所以"打死"的战斗秒不能和录像比；拿 video.hp（血条）和仿真从 55.25 起的累计伤害比。
# 配装照视频结尾（一年前）：库存里还在的声骸 id 见 docs/team3-candidates.md。散华首位的异构武装不在 xlsx 声骸表里，
