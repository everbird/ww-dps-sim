# 回填闭环 echo-input-priority.backfill 的 setup（docs/evidence/echo-input-priority.backfill.yaml，docs/experiments/C8-声骸起手优先级.md 的"结果"）：
# 散华的 E 一起手就按 Q（无常凶鹭），写成抢帧 Q!：不等 E 的判定出手（E 第 19 帧出伤、生成冰棱），照这次实际的操作（2026-11-26 iPad 上肉眼看，没录像）。
# 与 echo-input-priority-散华EQ.yaml 只差这一处：那份是缺省的"等 E 出手再按 Q"，预测的是打法，不是这次的操作（旧闭环作废的原因）。
# 两个候选：generic-5 = 声骸起手按通用块的优先级 5，第 1 帧就打断 E，没生成的判定作废；echo-table = 按声骸表的优先级，抢帧也要等 E 结束或进派生窗口。
# 放在 scenarios/evidence/ 下：不进场景快照、conformance、敏感度矩阵（它们只扫 scenarios/ 这一层）。
