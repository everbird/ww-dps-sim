enemy: { preset: 全息6/无常凶鹭 }
initial: { onField: 2 }               # 莫宁先上
opening:
  # 莫宁：3A + 重击（位势转换，展开谐振场）→ R → 空中 3A + E + 重击（反演）→ Q → 变奏切琳奈
  - 莫宁 A1 A2 A3 强化重击 大招 观测A1 观测A2 观测A3 E2 观测重击 Q 观测A1~ 观测A2~   # 协奏差一点就补观测普攻
  - switch 琳奈 变奏
  - 琳奈 E1
  - switch 爱弥斯
  - 爱弥斯 A1 A2 E2                  # 2A-E（视频结尾作者的流程图；Gemini 整理成"a2 + a3 + E"）：E 是合击·兵装融合（切成机兵）
  - switch 琳奈
  # 琳奈：R → 蓄力 A + Q → 三下跳跃（幻光折跃）+ 下落 A（本色满 3，视觉冲击）→ 变奏切爱弥斯
  - 琳奈 大招 灵感碰撞-蓄力 灵感碰撞3级 Q 轮滑跳跃 轮滑跳跃-折跃2 轮滑跳跃-折跃3 E4
  - switch 爱弥斯 变奏
  # 爱弥斯（机兵形态，变奏是携星辉降临于此）：Q + 机兵 a3 a4 → 处决 → R（过载）→ 强化 E（登台）→ 3A + 强化 E（降临）→ 机兵快速重击 + R（终结）
  # → E（构型切换）+ a2 + a3 → E（启明之音）→ 变奏切莫宁
  - 爱弥斯 机兵·A3 机兵·A4 Q 机兵·谐度破坏? 大招1 机兵·强化E A2 A3 A4 A1~ A2~ A3~ A4~ 强化E 机兵·蓄力 机兵·强化重击 大招2 E1-常规切换机兵 机兵·A1 机兵·A2 机兵·A3 机兵·E2
rotation:
  # 莫宁：变奏登场直接 R → 3A + E + 重击 → Q → 变奏切琳奈
  - switch 莫宁 变奏
  - 莫宁 大招 观测A1 观测A2 观测A3 E2 观测重击 Q 观测A1~ 观测A2~
  - switch 琳奈 变奏
  - 琳奈 E1
  - switch 爱弥斯
  - 爱弥斯 A1 A2 E2
  - switch 琳奈
  - 琳奈 大招 灵感碰撞-蓄力 灵感碰撞3级 Q 轮滑跳跃 轮滑跳跃-折跃2 轮滑跳跃-折跃3 E4
  - switch 爱弥斯 变奏
  - 爱弥斯 机兵·A3 机兵·A4 Q 机兵·谐度破坏? 大招1 机兵·强化E A2 A3 A4 A1~ A2~ A3~ A4~ 强化E 机兵·蓄力 机兵·强化重击 大招2 E1-常规切换机兵 机兵·A1 机兵·A2 机兵·A3 机兵·E2
options: { repeat: 6, maxFrames: 60000, tuneBreak: manual }
