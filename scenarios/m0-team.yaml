# M0 队伍代表轴（TD-08 §6）：维里奈 → 散华 → 椿，开局满能量，循环 4 轮（结尾切回维里奈）；比较配装看稳态（完整的轮）。
# 第一版：按机制排的，不是实战手法——等实战轴定了再替换，tests/scenarios.test.ts 的快照跟着人工确认后更新。
# 排法的考虑：
# - 先维里奈后散华，椿最后上：椿吃到散华延奏（普攻加深 38%，14 秒，切走清除）和维里奈延奏（全队全伤害加深 15%，30 秒）
# - 切人要等协奏满：切人在上一个动作开始的那一刻就执行，而协奏按命中给（rules.concertoTiming: onHit），
#   所以切人前要多排一个动作，让前一个动作的命中先到账（散华 A5 开始时 A4 的协奏已到账）
# - 椿：变奏给 100 点红椿·蕊；白椿普攻和盛绽攒协奏、耗蕊（每 10 点蕊协奏 +4、红椿·蕾 +1）；协奏满放一日花进含苞，
#   含苞期间普攻吃酣梦（倍率 + 倍率 × 5% × (10 + 红椿·蕾层数)）；最后放大招
# - 声骸按 docs/test-echos-setup.md（全部 +25；异相只换配色，数值同本体）。首位声骸 Q 放在哪看它和别人 buff 的时效
#   （各位置都试过，取 DPS 最高的，2026-10-04）：
#   · 维里奈的无归的谬误（全队攻击 +10%，20 秒）放在最后、大招之后：尽量罩住椿的爆发
#   · 散华的无常凶鹭代替最后一段普攻：切人在它开始的那一刻，凶鹭在后台下砸、回能；15 秒内的延奏让椿伤害 +12%
#   · 椿的无妄者放在含苞普攻之后、大招之前：放在前面会把一日花推到散华延奏（普攻加深，14 秒）、维里奈固有（攻击 +20%）、
#     无归的谬误之后，一日花少约 5.7 万
data: "20260707"
team:
  - char: 椿
    chain: 0
    weapon: { name: 千古洑流, rank: 5 }
    echoes:                         # 沉日劫明 5 件（4-3-3-1-1）
      - { name: 异相·无妄者, set: 沉日劫明, main: { 暴击伤害: 0.44, 攻击: 150 }, subs: { 攻击%: 0.071, 共鸣解放伤害加成: 0.094, 暴击伤害: 0.21, 普攻伤害加成: 0.101, 暴击率: 0.081 } }
      - { name: 暗鬃狼, set: 沉日劫明, main: { 湮灭伤害加成: 0.3, 攻击: 100 }, subs: { 暴击率: 0.075, 攻击: 40, 生命: 470, 暴击伤害: 0.138, 普攻伤害加成: 0.101 } }
      - { name: 刺玫菇, set: 沉日劫明, main: { 湮灭伤害加成: 0.3, 攻击: 100 }, subs: { 攻击%: 0.109, 暴击率: 0.075, 重击伤害加成: 0.101, 暴击伤害: 0.174, 防御%: 0.109 } }
      - { name: 刺玫菇（稚形）, set: 沉日劫明, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 暴击伤害: 0.15, 暴击率: 0.069, 攻击: 50, 共鸣技能伤害加成: 0.101, 共鸣效率: 0.084 } }
      - { name: 遁地鼠, set: 沉日劫明, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 暴击伤害: 0.126, 攻击%: 0.094, 防御: 50, 暴击率: 0.105, 共鸣效率: 0.108 } }
  - char: 散华
    chain: 6
    weapon: { name: 行进序曲, rank: 5 }
    echoes:                         # 轻云出月 5 件
      - { name: 无常凶鹭, set: 轻云出月, main: { 暴击伤害: 0.44, 攻击: 150 }, subs: { 暴击率: 0.063, 攻击%: 0.101, 共鸣解放伤害加成: 0.079, 共鸣技能伤害加成: 0.086, 暴击伤害: 0.162 } }
      - { name: 绿熔蜥, set: 轻云出月, main: { 冷凝伤害加成: 0.3, 攻击: 100 }, subs: { 暴击率: 0.063, 暴击伤害: 0.138, 攻击%: 0.071, 生命: 470, 共鸣技能伤害加成: 0.101 } }
      - { name: 坚岩斗士, set: 轻云出月, main: { 冷凝伤害加成: 0.3, 攻击: 100 }, subs: { 生命: 430, 暴击率: 0.087, 暴击伤害: 0.162, 共鸣技能伤害加成: 0.086, 共鸣效率: 0.084 } }
      - { name: 裂变幼岩, set: 轻云出月, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 共鸣技能伤害加成: 0.101, 暴击伤害: 0.126, 共鸣解放伤害加成: 0.094, 暴击率: 0.081, 攻击%: 0.079 } }
      - { name: 冷凝棱镜, set: 轻云出月, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 攻击: 40, 共鸣解放伤害加成: 0.079, 暴击率: 0.063, 暴击伤害: 0.126, 普攻伤害加成: 0.109 } }
  - char: 维里奈
    chain: 3
    weapon: { name: 奇幻变奏, rank: 5 }
    echoes:                         # 隐世回光 5 件
      - { name: 异相·无归的谬误, set: 隐世回光, main: { 治疗效果加成: 0.264, 攻击: 150 }, subs: { 共鸣效率: 0.108, 共鸣技能伤害加成: 0.101, 防御: 50, 生命%: 0.109, 重击伤害加成: 0.064 } }
      - { name: 戏猿, set: 隐世回光, main: { 共鸣效率: 0.32, 攻击: 100 }, subs: { 攻击: 50, 共鸣效率: 0.084, 生命: 510, 共鸣技能伤害加成: 0.079, 暴击伤害: 0.138 } }
      - { name: 异相·磐石守卫, set: 隐世回光, main: { 共鸣效率: 0.32, 攻击: 100 }, subs: { 共鸣技能伤害加成: 0.064, 共鸣解放伤害加成: 0.086, 暴击伤害: 0.186, 共鸣效率: 0.1, 普攻伤害加成: 0.101 } }
      - { name: 裂变幼岩, set: 隐世回光, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 共鸣技能伤害加成: 0.079, 攻击: 50, 暴击率: 0.063, 重击伤害加成: 0.101, 共鸣效率: 0.116 } }
      - { name: 火鬃狼, set: 隐世回光, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 共鸣效率: 0.092, 防御%: 0.081, 暴击伤害: 0.15, 生命: 430, 共鸣技能伤害加成: 0.094 } }
enemy: { preset: 全息6/朔雷之鳞 }
initial: { onField: 2 }            # 维里奈先上场；能量缺省满、协奏缺省 0
rotation:
  - 维里奈 E A1 A2 A3 A4 A5 重击 R Q # 攒满协奏；强化重击耗 1 层光合能量；大招给敌人挂光合标记（协同攻击）；最后放无归的谬误
  - switch 散华                       # 变奏切人；维里奈延奏：全队全伤害加深 15%、攻击 +20%
  - 散华 E R 重击居合                 # 冰棘（变奏）、冰棱（E）、冰川（大招）一起被重击爆裂引爆，6 链攻击 +10% 两层
  - 散华 A1 A2 A3 A4 Q                # 补满协奏；最后放无常凶鹭（A4 的协奏已到账）
  - switch 椿                         # 变奏切人（Q 开始时切，凶鹭在后台打完）；散华延奏、无常凶鹭、轻云出月给椿
  - 椿 A1 A2 A3 A4 A5                 # 白椿普攻：耗红椿·蕊，攒协奏与红椿·蕾
  - 椿 E1 盛绽·A1 盛绽·A2 盛绽·A3 盛绽·A4 E2   # 盛绽一轮，E2 退出
  - 椿 E3                             # 一日花：协奏 −70，红椿·蕊 +100，进入含苞（15 秒）
  - 椿 A1 A2 A3 A4 A5 Q R             # 含苞中普攻吃酣梦；放无妄者，最后大招
  - switch 维里奈                     # 下一轮；能量、协奏、冷却接着用
# 谐度破坏用缺省 tuneBreak: auto（失谐就由前台角色放）：M0 三人的谐度破坏只造成伤害，留着没有好处。
# 要留到某个时机的队伍写 tuneBreak: manual，在轴里想放的位置写"<角色> 谐度破坏?"（TD-06 §13.4）
options: { repeat: 4, maxFrames: 12000 }
