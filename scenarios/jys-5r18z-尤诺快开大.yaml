enemy: { preset: 全息6/无常凶鹭 }
initial: { onField: 0 }               # 景燃先上
opening:
  # 景e → 月e → 守aae → 月e → 景a → 守aaz闪aaazqr → 变奏月 q 跳 r aaa ee z
  - 景燃 阳E1
  - switch 尤诺
  - 尤诺 E1
  - switch 守岸人
  - 守岸人 A1 A2 E-地面
  - switch 尤诺
  - 尤诺 E2                           # "强化 e"= 告终的喧响（E1 解锁，进入月相流转·弦月）
  - switch 景燃
  - 景燃 阳A2-地面出场技               # 只为触发声骸 / 套装；普通切入按 A 是阳A2 出场技（jys-videos §8.1）
  - switch 守岸人
  - 守岸人 A1 A2 A3 强化重击 闪避 A1 A2 A3 强化重击 Q 大招 A1~ A2~   # A3 一抬手就按 z（实论数据已满 5 段，是演绎），闪避取消；协奏差一点就补一下普攻（视频里的说法）
  - switch 尤诺 变奏
  - 尤诺 Q 跳跃-变弓 大招 强化弓A1 强化弓A2 强化弓A3 强化E3 强化E3 至臻完满   # 跳了再开大；大招后 aaa、ee、z
rotation:
  # 一轮从变奏切景燃起（守岸人的补位要紧接"变奏切尤诺"，所以轮的边界放在景燃）
  # 变奏景 qr z aaa 处决 eaz eaz（处决 = 谐度破坏，视频里用来取消 A3 的后摇；仿真里强化重击本来就能直接取消 A3，谐度破坏按缺省自动放）
  - switch 景燃 变奏
  - 景燃 Q 大招 阳重击 阴A1 阴A2 阴A3 阴A4 阴重击 阳E1 阳E2 阳重击 阴E1 阴E2 阴重击
  # 变奏守 → 守eaa → 月e闪e → 景a → 守aazqr
  - switch 守岸人 变奏
  - 守岸人 E-地面 A1 A2
  - switch 尤诺
  - 尤诺 E1 闪避 E2
  - switch 景燃
  - 景燃 阳A2-地面出场技               # 只为触发声骸 / 套装；普通切入按 A 是阳A2 出场技（jys-videos §8.1）
  - switch 守岸人
  - 守岸人 A1 A2 强化重击 Q 大招 A1~ A2~
  - switch 尤诺 变奏
  - 尤诺 Q 跳跃-变弓 大招! 强化弓A1 强化弓A2 强化弓A3 强化E3 强化E3 至臻完满
options: { repeat: 6, maxFrames: 60000 }
