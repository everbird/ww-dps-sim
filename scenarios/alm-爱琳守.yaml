# 爱弥斯 · 琳奈 · 守岸人（"爱琳守"，B 站 BV1Z9FpzyEKo"爱琳守-震谐手法教学"，作者长风ei；按视频结尾作者的流程图写，与 Gemini 整理的文字不同处见 docs/alm-confirm.md §3）
# 养成（2026-10-25 你给的）：爱弥斯 0 链、专武永远的启明星精炼 1 阶；琳奈 0 链、停驻之烟精炼 5 阶；莫宁 0 链、异响空灵（四星"施放共鸣技能时回复协奏"的长刃）精炼 5 阶；
# 守岸人同景尤守（1 链、星序协响精炼 1 阶）。声骸取 Evariste 账号扫描时装在各人身上的那套（inventory/Evariste-bag.yaml），首位都是 4C。
# 谐度破坏写成手动：只在爱弥斯机兵 A4 后放（攻略"若处决条已满优先打出处决"），没失谐就跳过；见 docs/alm-confirm.md
