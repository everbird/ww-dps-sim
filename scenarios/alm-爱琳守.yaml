enemy: { preset: 全息6/无常凶鹭 }
initial: { onField: 1 }               # 琳奈先上
opening:
  - 琳奈 E1                          # 琳奈 E 切守
  - switch 守岸人
  - 守岸人 A1 A2 A3 E-地面           # 3A - E（合轴切爱）
  - switch 爱弥斯
  - 爱弥斯 A1 A2 A3 A4               # 4A（第 4 段后退时切守）
  - switch 守岸人
  - 守岸人 A1 A2 A3 强化重击 闪避 A1 A2 A3 强化重击 Q 大招   # 3A + 重击 + 闪 → 3A + 重击 + Q + R
  - switch 琳奈 变奏
  - 琳奈 E1                          # 变奏登场 E，切爱
  - switch 爱弥斯
  - 爱弥斯 A1 A2 A3 A4 E2            # 4A - E（合击·兵装融合，切成机兵），合轴切琳
  - switch 琳奈
  - 琳奈 大招 灵感碰撞-蓄力 灵感碰撞3级 Q 轮滑跳跃 轮滑跳跃-折跃2 轮滑跳跃-折跃3 E4 E2   # R → 蓄力（同 Q）→ 跳 ×3 → 下落 A → E
  - switch 爱弥斯 变奏
  # a3a4 + R → 强化E（登台）+ 处决 → 2A（谐度破坏后接 A3、A4）+ 强化E（降临）→ 快速重击 + R终结（作者的流程图，没有声骸）
  - 爱弥斯 机兵·A3 机兵·A4 大招1 机兵·强化E 谐度破坏 A3 A4 强化E 机兵·蓄力 机兵·强化重击 大招2
rotation:
  - switch 守岸人 变奏
  - 守岸人 A1 A2 A3 E-地面           # 变奏入场 → 3A - E（合轴切爱）
  - switch 爱弥斯
  - 爱弥斯 A1 A2 A3 A4               # 4A（切守）
  - switch 守岸人
  - 守岸人 A1 A2 A3 强化重击 Q 大招   # 3A + 重击 + Q + R
  - switch 琳奈 变奏
  - 琳奈 E1
  - switch 爱弥斯
  - 爱弥斯 A1 A2 A3 A4 E2
  - switch 琳奈
  - 琳奈 大招 灵感碰撞-蓄力 灵感碰撞3级 Q 轮滑跳跃 轮滑跳跃-折跃2 轮滑跳跃-折跃3 E4 E2
  - switch 爱弥斯 变奏
  # a3a4 + 处决 → R + 强化E（登台）→ 3A + 强化E（降临）→ 快速重击 + R终结 → 变奏切守（作者的流程图，没有声骸）
  - 爱弥斯 机兵·A3 机兵·A4 机兵·谐度破坏? 大招1 机兵·强化E A2 A3 A4 强化E 机兵·蓄力 机兵·强化重击 大招2
options: { repeat: 10, maxFrames: 100000, tuneBreak: manual }   # 谐度破坏隔一轮才赶上一次，多跑几轮把相位平均掉
