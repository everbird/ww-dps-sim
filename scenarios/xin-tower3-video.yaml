# 记法（2026-10-27，第二版：只照录像读，不参考轴教学——你实战是按自己的理解打的）：
#   切人 = 生命条上的最大生命变的那一格（每秒 4 格；心 16485、雷主 16453、卜灵 18762）；变奏还是普通看切人前协奏环满没满。
#   段里：右下角技能栏的冷却数字读出共鸣技能、声骸、大招 / 超负荷的时刻（数字出现的那一格，约 ±0.5 秒）；心的镇红尘看跳字（大红花 + 30 万级的数），
#   万阙连衡看技能栏发亮，镇寰宇是统御众机结束时的短过场（跳字 270591 / 318043，紫色），借相看技能栏图标在应世 / 照世之间换；
#   卜灵的两下重击看 LB 发亮的时刻，哪一式按卦象推（A2 艮、A4 震、E 震：先山雷颐得少阳，E 接普攻第 4 段后震为雷得少阴）。
#   谐度破坏照你按 B 的时刻手写（28.6 雷主、95.7 心、134.8 雷主、183.5 雷主，镜头切近景那一格；tuneBreak: manual）；前两次打的是小怪，仿真只建 boss，先写"敌人 失谐"。
#   其余的普攻都是补位（"补位 → at → 补位 → 动作"：先补到 at 的时刻，过了 at 动作还放不出来就接着补）。读法与整张表见 docs/tower-20261026.md 中 3"录像里读到的技能时刻"。
