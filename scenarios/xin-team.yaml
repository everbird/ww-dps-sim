# 心 · 雷主 · 卜灵（2026-10-19 用户给的轴）· 卜灵奇幻变奏 1 阶（用户账号的配置）。确认清单见 docs/xin-confirm.md。
# 与 xin-team-r5.yaml 只差卜灵武器的阶数（视频里是 5 阶），两份对照看工具怎么发现问题、怎么验证问题改好了（xin-confirm §1 X1）：
#   本份（1 阶）卜灵每轮只攒到 98.9 协奏，"switch 雷主·男 变奏"变不成变奏，pnpm sim 与网页时间轴报"轴可能有问题"；
#   5 阶的奇幻变奏 E 回 16 点协奏（1 阶 8 点），一共 106.9，够了。pnpm compare scenarios/xin-team.yaml scenarios/xin-team-r5.yaml 看差多少
# 原文：
#   启动轴：心 AAA（A3 合轴后自己打出）→ 雷主 E → 卜灵 下落A（蓝符） A（黄符） E A （2蓝符）Z（按住打满下方2个共鸣回路）Q R
#           → 雷主 变奏 A打满共鸣能量 R 点按强化E Q → 心 变奏 A满共鸣回路 Z R E A满共鸣回路 强化E AAAA Z R
#   循环轴：雷主 变奏 E → 卜灵 …（之后同启动轴）
# 按键 → 动作：
#   心：AAA = A1 A2 A3（A3 起手就切走：A3 的三下"脱手后自行生成"，切人不打断）；变奏（电磁模态）之后按 A 是第 4 段；
#       Z = 应世心满了的重击：了尘愿可用时是镇红尘（增幅强化重击），否则步红尘；R = 转相（不耗能量，进照世相）；
#       照世相：E = 照世·E，A = 照世·A1、A2…（A2 引爆 A1 的活字心锁，转相后第一次引爆另得 150 照世心），强化E = 万阙连衡，
#       AAAA = 强化A1–A4（统御众机），Z = 照世心耗完后的重击：承天则可用时是镇寰宇，否则临寰宇；R = 万阙垂天（要满能量，回到应世相）
#   雷主：E = 雷引（打完在空中）；R = 最终战略；点按强化E = 短按超负荷（要电涌满 120）
#   卜灵：下落A = 空中攻击（雷主 E 之后在空中，得震）；A = 普攻第 2 段（得艮：落地后接 A 出的是第 2 段，按"A（黄符）"推的）；
#       E = 遁影牵雷（得震）；A = E 派生的普攻第 4 段（得震）；这时卦象从左到右是 震艮震震，
#       Z 按住打满 = 雷山小过（震艮 → 少阳）+ 震为雷（震震 → 少阴）→ 阴阳相生；R = 飞雷诀·归一（开阵 24 秒）
#       大招第 238 帧前不能切人（"不响应输入"按不能切人算，假设 ult-no-switch），开阵在第 236 帧，之后的变奏算进雷法
#       E 写成 "E +6"：A2 的伤害"脱手后延迟6F生效"，得艮在它命中时；E 一施放就得震。最早合法帧（A2 第 3 帧）就按 E 的话，
#       震会排在艮前面（震震艮震），凑不出雷山小过；实战里 A、E 两下之间也不会这么快（2026-10-20，接入「延迟」之后）
# "A打满"写成补位"~"（TD-09 §3.2）：后面那个动作（R、超负荷、镇红尘、万阙连衡）能放了就不再补 A。
# 与原文不同的两处（按数据原文的轴接不上，docs/xin-confirm.md §1）：
#   · 雷主 Q 之后、切心之前补位 A（X3，2026-10-19 用户同意）：雷主大招前能量已经满的那几轮，"A打满共鸣能量"一下都不用打，
#     协奏不到 100，切心不是变奏；补位后面接"switch 心 变奏"（TD-09 §3.2 的扩展）：协奏满了就不补
#   · 心万阙垂天前补位 A（X2，待定）：按数据心每轮回的能量不够 125，差约 15 点放不出万阙垂天；能量满了就不再补
# 开局三人能量满（X5，用户定）：启动轴里雷主一变奏就能放大招，补位的 A 都省掉，大招之后再补 A 把电涌打满放超负荷。
# 敌人用全息 6 无常凶鹭（X4，用户定；90 级、各元素抗性 10%）：M0 场景用的朔雷之鳞导电抗性 80%，不适合这队。
# 配装：everbird 账号扫描时三人身上的（inventory/everbird-bag.yaml，2026-10-19 扫描），声骸 id 写在行尾。
