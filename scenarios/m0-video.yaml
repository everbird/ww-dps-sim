# 椿散维教学轴：B 站 BV1VBja6sErw「本质轮椅！椿散维五花25s循环轴」（暗羽kkk，2026-06-18）简介里的启动轴与循环轴。
# 原文（用户用 Gemini 对过视频，与视频一致）：
#   启动轴：椿AAE→散EZR→维AAAEQR跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
#   循环轴：椿→散EZR→维AAAEQ→椿AE→维R跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
# 记号：A 普攻、E 共鸣技能、Z 长按攻击、Q 声骸、R 大招、跳、闪、→ 切人；"5" 是漏打的 →（2026-10-04 用户确认）。
# 推演按 m0-confirm §6 C1（切人不退出盛绽，用户再次确认）："AAE / AE"的 E1 进红椿后，到 AAAAAE 之前没有退出盛绽的操作
#   （只有黯蕊猎心、控物、旋舞会退），所以 AAAAA 是蔓舞、E 是 E2。这样变奏拿到的 100 点红椿·蕊只耗掉 81.9，按原文轴走到
#   "椿REE"时协奏不到 100（开局蕊按 0），一日花放不出来。
# 视频在一日花前有字幕"协奏不够多a一下"（用户说明）：原文轴少写了这一下。写成补位"A1~ A2~"（TD-09 §3.2）：一日花放不出来才补，
#   补完一下能放了就不补第二下。大招后白椿 A1 只回 1.85，能不能再凑一次"耗 10 点蕊 +4"看那一轮的余数，所以有的轮一下、有的轮两下。
# 20261003 版数据：散华"大招-引爆冰川"给协奏，散华切维里奈每轮都是变奏（与视频一致）。
# 未定：开局椿的红椿·蕊按 0（视频里没核对）。
# 按键 → 动作（2026-10-04 用户说明；椿的白椿 / 红椿按规则推：E1 进红椿，E2 / 盛绽跳跃回白椿，切人不改，一日花不改颜色，
# 协奏满且一日花不在冷却时 E 自动是一日花）：
#   椿：AAE = 白椿两下 + E1 进盛绽；AAAAAE = 蔓舞 5 下（4 段后重新起手）+ E2 退盛绽；REE = 白椿放大招、E3 一日花、E1 回红椿；
#       Z = 长按（红椿里是烬华蔓舞）；闪 = 盛绽闪避；红椿里的 A 是蔓舞
#   散华：Z = 重击居合；维里奈：跳AAA = 强化空中攻击（星星花绽放）
# 配装：只有椿的首位按视频换成梦魇·无冠者，其余沿用 m0-team.yaml（用户以后把实际声骸调成和视频一致）。
data: "20261003"
