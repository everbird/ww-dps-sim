# 椿散维教学轴：B 站 BV1VBja6sErw「本质轮椅！椿散维五花25s循环轴」（暗羽kkk，2026-06-18）简介里的启动轴与循环轴。
# 原文（用户用 Gemini 对过视频，与视频一致）：
#   启动轴：椿AAE→散EZR→维AAAEQR跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
#   循环轴：椿→散EZR→维AAAEQ→椿AE→维R跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
# 记号：A 普攻、E 共鸣技能、Z 长按攻击、Q 声骸、R 大招、跳、闪、→ 切人；"5" 是漏打的 →（2026-10-04 用户确认）。
# 这一份按原文的"散AQ"写，2026-10-18 起留存，作为有问题的轴（也是有用的数据）：用户推测原文的"散AQ变奏椿"其实是"散EQ变奏椿"
#   （E 此时已冷却），那一版是 m0-video-eq.yaml（m0-confirm §11 V7，待查证）。按 AQ，启动轴那次"散AQ→椿"散华协奏只有 92、第 1 轮
#   只有 19，都不是变奏，和"变奏椿"对不上（第 1 轮散华切维里奈反倒是变奏，延奏给了维里奈；维里奈先放变奏技能再按 A，这时多半不是出场技，但这一轮照样按出场技 A4 A5 算），第 2 轮起才是。两处写成
#   "switch 椿 变奏"：没变奏时 pnpm sim 列在"轴可能有问题"，网页时间轴顶上有提示条、切人处有标记（AGENTS.md 差异 3）。
# 散华按 ERZ 打（2026-10-18 用户指出）：原文与 Gemini 核对的都是 EZR，但 R 放在最后不对——先 E、R，再重击居合，一次把冰棘（变奏）、
#   冰棱（E）、冰川（R）一起引爆，6 链两层攻击一次叠满，4 链"放大招后 5 秒内的下次重击爆裂 +120%"也吃得到（同 m0-team.yaml；能量论举的
#   例子也是"实战erz"）；EZR 时冰川要等 5 链"消失时直接爆炸"（6.5 秒后）。
#   重击一出手就切维里奈：切人不打断重击（TD-05 §2；能量论"切人，该角色仍然会在场上打完技能"），引爆在后台打中，切人时散华协奏
#   只有 70，维里奈不是变奏；协奏在后台满 100，留到"散AQ→椿"，散华的延奏、轻云出月、无常凶鹭都给椿——"散AQ→椿"就是为这个排的
#   （2026-10-18 用户判断；后台命中给的协奏算不算，用户待查证）。这样稳态每轮正好 25 秒：维里奈、椿的大招冷却都是 25 秒，维里奈的大招
#   还要等 85 帧冷却。若等引爆打中再切（维里奈变奏），每轮 25.80 秒、超过冷却，稳态 DPS 低 22%（散华的延奏落在维里奈身上）。
# 推演按 m0-confirm §6 C1（切人不退出盛绽，用户再次确认）："AAE / AE"的 E1 进红椿后，到 AAAAAE 之前没有退出盛绽的操作
#   （只有黯蕊猎心、控物、旋舞会退），所以 AAAAA 是蔓舞、E 是 E2。这样变奏拿到的 100 点红椿·蕊只耗掉 81.9，按原文轴走到
#   "椿REE"时协奏不到 100（开局蕊按 0），一日花放不出来。
# 视频在一日花前有字幕"协奏不够多a一下"（用户说明）：原文轴少写了这一下。写成补位"A1~ A2~"（TD-09 §3.2）：一日花放不出来才补，
#   补完一下能放了就不补第二下。现在（ERZ 之后）只有启动轴和第 1 轮各补两下（那两次椿不是变奏入场），之后各轮椿变奏入场、协奏够了不用补。
# 20261003 版数据：散华"大招-引爆冰川"给协奏（20260707 版不给）。按 ERZ 重击出手就切：第 1 轮散华切维里奈是变奏（启动轴剩的协奏），
#   之后各轮散华切维里奈是普通切人、"散AQ→椿"是变奏（见上）。
# 开局椿的红椿·蕊按 0（2026-10-05 用户确认）。
# 按键 → 动作（2026-10-04 用户说明；椿的白椿 / 红椿按规则推：E1 进红椿，E2 / 盛绽跳跃回白椿，切人不改，一日花不改颜色，
# 协奏满且一日花不在冷却时 E 自动是一日花）：
#   椿：AAE = 白椿两下 + E1 进盛绽（开局就在场上，不是入场）；AE（普通切人入场）= 地面出场技（就是 A2，2026-10-18 用户实测，
#       xlsx 没写，m0-confirm §11 V10）+ E1；AAAAAE = 蔓舞 5 下（4 段后重新起手）+ E2 退盛绽；REE = 白椿放大招、E3 一日花、E1 回红椿；
#       Z = 长按（红椿里是烬华蔓舞）；闪 = 盛绽闪避；红椿里的 A 是蔓舞
#   散华：Z = 重击居合
#   维里奈：AAA（普通切人入场）= 地面出场技（A3 组里那一行）+ A4 + A5（2026-10-18 用户确认，m0-confirm §11 V10）；
#       跳AAA = 强化空中攻击（星星花绽放）
# 配装：视频只给了声骸配置的硬性指标；椿的首位换成梦魇·无冠者后都满足，其余沿用 m0-team.yaml、不用调整（2026-10-05 用户确认）。
