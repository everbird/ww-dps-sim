  - char: 椿
    chain: 0
    weapon: { name: 千古洑流, rank: 5 }
    echoes:                         # 沉日劫明 5 件（4-3-3-1-1）；首位换成梦魇·无冠者（视频里两次 Q 隔得很近，2026-10-04 用户确认）
      - { name: 梦魇·无冠者, set: 沉日劫明, main: { 暴击伤害: 0.44, 攻击: 150 }, subs: { 攻击%: 0.071, 共鸣解放伤害加成: 0.094, 暴击伤害: 0.21, 普攻伤害加成: 0.101, 暴击率: 0.081 } }
