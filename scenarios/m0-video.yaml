      - { name: 火鬃狼, set: 隐世回光, main: { 攻击%: 0.18, 生命: 2280 }, subs: { 共鸣效率: 0.092, 防御%: 0.081, 暴击伤害: 0.15, 生命: 430, 共鸣技能伤害加成: 0.094 } }
enemy: { preset: 全息6/朔雷之鳞 }
initial: { onField: 0 }               # 椿先上；能量缺省满（开场维里奈、散华就放大招）、协奏 0
opening:
  - 椿 A1 A2 E1                        # 椿AAE：白椿两下，E 进盛绽（红椿）
  - switch 散华
  - 散华 E 重击居合 R                    # 散EZR
  - switch 维里奈
  - 维里奈 A1 A2 A3 E Q R                # 维AAAEQR
  - 维里奈 跳跃 强化空中A1 强化空中A2 强化空中A3   # 跳AAA
  - switch 椿                           # 维里奈协奏满 → 椿变奏
  - 椿 盛绽·A1 盛绽·A2 盛绽·A3 盛绽·A4 盛绽·A1 E2   # AAAAAE：还在红椿 → 蔓舞 5 下，E2 退盛绽
  - switch 散华                         # "5"
  - 散华 A1 Q                           # 散AQ
  - switch 椿
  - 椿 大招 A1~ A2~ E3 E1 盛绽·A3循环聚怪 Q   # REEZQ：白椿放大招，协奏不够补 A（见开头），一日花，E 回红椿，长按烬华蔓舞，无冠者
  - 椿 盛绽·闪避 盛绽·A1 盛绽·A2 盛绽·A3 E2 Q   # 闪AAAEQ：红椿里闪避、蔓舞三下，E 退盛绽，无冠者
rotation:
  - switch 散华                         # 椿→
  - 散华 E 重击居合 R                    # 散EZR
  - switch 维里奈
  - 维里奈 A1 A2 A3 E Q                  # 维AAAEQ
  - switch 椿
  - 椿 A1 E1                            # 椿AE：白椿一下，E 进盛绽
  - switch 维里奈
  - 维里奈 大招 跳跃 强化空中A1 强化空中A2 强化空中A3   # 维R跳AAA
  - switch 椿
  - 椿 盛绽·A1 盛绽·A2 盛绽·A3 盛绽·A4 盛绽·A1 E2   # AAAAAE
  - switch 散华                         # "5"
  - 散华 A1 Q                           # 散AQ
  - switch 椿
  - 椿 大招 A1~ A2~ E3 E1 盛绽·A3循环聚怪 Q   # REEZQ（补 A 见开头）
  - 椿 盛绽·闪避 盛绽·A1 盛绽·A2 盛绽·A3 E2 Q   # 闪AAAEQ
options: { repeat: 4, maxFrames: 15000 }
