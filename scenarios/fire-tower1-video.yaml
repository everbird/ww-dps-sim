# 录像剖析（purpose: replay），不是轴教学：照录像把整局一段段记下来，给视图 F 对视频用。怎么记的、对不上的见 docs/tower-20261026.md。
# 记法（2026-10-26，第一版）：
#   切人 = 生命条上的最大生命变的那一格（每秒 4 格；嘉贝莉娜 15518、达妮娅 17172、露帕 17292，和下面的配装算出来的差 0～1）。
#   大招 = 过场时计时器消失的那一刻；E、放逐、声骸看技能栏的冷却数字（第二轮逐格读，第一、三轮估）。都用"at <世界秒>"钉住（世界秒 = 视频秒 − 2.2）。
#   段里普攻打了几段看不清：按各人的打法估（露帕大招后破敌、赛点沸腾里普攻攒狼焰、狼咬锐爪、狼舞的决意·极；达妮娅白 E、白大招、黑 A、放逐、黑大招、离场前声骸；
#   嘉贝莉娜声骸、迫近、普攻攒罪火、恶翼扬升、大招、恶魔普攻）。
# 配装：三人都是 0 链、专武 1 精（你说"都是 01"；专武是推断）。声骸按 2026-10-19 的库存：嘉贝莉娜、露帕照扫描时装在身上的，
# 达妮娅换成斑驳粉饰之沫 5 件（你确认的套装；具体哪 5 件是按最大生命对出来的）。
# 敌人：41塔中1 只有辉萤军势一只（Lv.100、5,510,473），录像 145.3 打死（计时器 03:24.6，战斗约 95.4 秒）——这一局打死的时刻能和仿真比。
# 环境特性：录像开头的面板没展开，读不到，没写。
