initial: { onField: 0 }               # 景燃先上
opening:
  # 莫特斐的两段 E 写成 E2? E1 E2?：变奏时怒气值满了先怒火赋格，没满先激昂变奏（+40）再怒火赋格
  # 首轮：景e 莫a 守aaeaa 莫a 景a2a3a4【a4脱手退场】 莫a 守aaazqr 莫ree q 变奏景（作者勘误：首轮莫特斐也是 ree，不是 ere）
  - 景燃 阳E1
  - switch 莫特斐
  - 莫特斐 空中普攻                     # 景燃 E 起跳后切的，莫特斐切进来在空中，"入场平a"是空中攻击（切早了等景燃跳起）
  - switch 守岸人
  - 守岸人 A1 A2 E-地面 A1 A2
  - switch 莫特斐
  - 莫特斐 A4-地面出场技
  - wait 18                          # "射击瞬间切人"：等第一枪（A4-1 第 18 帧）
  - switch 景燃
  - 景燃 阳A2-地面出场技 阳A3 阳A4
  - switch 莫特斐
  - 莫特斐 A4-地面出场技
  - wait 18                          # "射击瞬间切人"：等第一枪（A4-1 第 18 帧）
  - switch 守岸人
  - 守岸人 A1 A2 A3 强化重击 Q 大招 A1~ A2~ A3~ A1~ A2~ A3~ A1~ A2~ A3~   # 协奏没满再补普攻（同 jys-5r18z；仿真的守岸人协奏偏少，jys-videos §7 第 2 条）
  - switch 莫特斐 变奏
  - 莫特斐 大招 E2? E1 E2? Q
  # "落下a"写成阳A1：数据里景燃变奏在地面、结束也在地面，接不上空中攻击（作者说"点平a他会打一个下落攻击"，待核对）
  # 首轮景：落下a q r z aa 处决 z eaz eaz eaz【均留场】 a4脱手退场 变奏守
  # 第三个 eaz 没写：阳E1 冷却 15 秒，第二次放不出来，炁也只有 100（作者解说"打完4套重击之后"打 A2 A3 A4，同循环）
  - switch 景燃 变奏
  - 景燃 阳A1 Q 大招 阳重击 阴A1 阴A2 阴A3~ 阴A4~ 阴重击 阳E1 阳E2 阳重击 阴E1 阴E2 阴重击 阳A1 阳A2 阳A3 阳A4
rotation:
  # 循环：（变奏守）守不动 → 莫a → 景a2a3 → 莫a → 守a2a3 e a2a3 → 莫a → 守zqr → 变奏莫 reeq
  - switch 守岸人 变奏
  - switch 莫特斐
  - 莫特斐 A4-地面出场技
  - wait 18                          # "射击瞬间切人"：等第一枪（A4-1 第 18 帧）
  - switch 景燃
  - 景燃 阳A2-地面出场技 阳A3
  - switch 莫特斐
  - 莫特斐 A4-地面出场技
  - wait 18                          # "射击瞬间切人"：等第一枪（A4-1 第 18 帧）
  - switch 守岸人
  - 守岸人 A1 A2 E-地面 A1 A2
  - switch 莫特斐
  - 莫特斐 A4-地面出场技
  - wait 18                          # "射击瞬间切人"：等第一枪（A4-1 第 18 帧）
  - switch 守岸人
  - 守岸人 强化重击 Q 大招 A1~ A2~ A3~ A1~ A2~ A3~ A1~ A2~ A3~
  - switch 莫特斐 变奏
  - 莫特斐 大招 E2? E1 E2? Q
  # 变奏景：落下a q r z aaa 处决 z eaz eaz a1a2a3【均留场】 a4脱手退场 变奏守
  - switch 景燃 变奏
  - 景燃 阳A1 Q 大招 阳重击 阴A1 阴A2 阴A3 阴A4~ 阴重击 阳E1 阳E2 阳重击 阴E1 阴E2 阴重击 阳A1 阳A2 阳A3 阳A4
options: { repeat: 6, maxFrames: 60000 }
