# 心 · 雷主 · 卜灵"25 秒轮椅轴"（B 站 BV1Dha16hEkc，作者长风ei；按视频左侧作者自己的流程图写，docs/xin-confirm.md §7）
# 配装与 xin-team-r5.yaml 一样（everbird 账号 + 卜灵奇幻变奏 5 阶），只有轴不同。视频里作者的配装（心 彻骨梦逝之心 + 鸣刹魔像、
# 雷主 幽影沉晦之网 + 无常凶鹭、卜灵 鸣钟之龟）不照搬。
# 作者流程图（视频左栏；结尾 2:48 另有一张时间轴图，切人"5次-5次"，雷主那段多一个"轻云Q"是带轻云套时 R 之后补放的 Q）：
#   启动轴：雷主 E-A → 卜灵 A-2A-E-A、重击*2-Q-R → 变奏主 → 雷主 Q-4A-强E-R → 变奏心 → 心 Q-A-重击-R、2A-E-强E、3A-闪-2A-重击、R2 → 变奏主
#   循环轴：雷主 E-下落A → 卜灵 下落A-2A-E-A、重击*2-Q-R → 变奏心 → 心（不动）→ 雷主 Q-4A-强E-R → 变奏心
#           → 心 Q-重击-R、2A-E-强E、3A-闪-2A-重击、R2 → 变奏主
# 和 xin-team-r5 的区别："心吃双变奏"——卜灵变奏切心，心不出招马上生切雷主，雷主打满协奏再变奏切心（雷主变奏回的能量少）。
# 按键 → 动作（同 xin-team-r5 开头）：雷主 下落A = 空中攻击，强E = 超负荷（短按强化E）；卜灵同 r5；
#   心：重击 = 镇红尘，R = 转相，2A = 照世·A1 A2，E = 照世·E，强E = 万阙连衡，3A-闪-2A = 照世·强化A1–A3、闪避、强化A1 A2，
#   重击 = 镇寰宇，R2 = 万阙垂天。
# 资源不够时补位（~，TD-09 §3.2）：镇红尘前补应世A、万阙连衡前补照世A、超负荷与雷主大招前补A、万阙垂天前补照世A、
#   雷主切心前补A（协奏）；作者的图上没写，补了几下看 pnpm trace。
