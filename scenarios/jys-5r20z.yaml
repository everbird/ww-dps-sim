enemy: { preset: 全息6/无常凶鹭 }
initial: { onField: 1 }               # 尤诺先上
opening:
  - 尤诺 E1 Q                          # E + Q 同时
  - switch 守岸人
  - 守岸人 大招 A1 A2 A3 E-地面         # R 先进冷却，AAA，E 脱手
  - switch 尤诺
  - 尤诺 E2 大招 跳跃-变弓              # 二段 E + R，动画结束跳
  - switch 守岸人
  - 守岸人 A1 A2 强化重击 跳跃          # 实论数据已满 5 段，重击是演绎；跳跃打断后摇，尤诺切进来在空中
  - switch 尤诺
  - 尤诺 强化弓A1 强化弓A2 强化E3       # 空中普攻 ×2 → E
  - switch 守岸人
  - 守岸人 A1 A2 重击 Q A1~ A2~ A3~ A4~ A1~ A2~   # 实论数据没满，是普通重击；原文此时协奏已满，仿真差约 8 点，补普攻（见 docs/jys-videos.md）
  - switch 尤诺 变奏
  - 尤诺 强化E3 至臻完满                 # 变奏入场 E + 重击（协奏满）
rotation:
  # 一轮从变奏切景燃起（守岸人的补位要紧接"变奏切尤诺"）
  - switch 景燃 变奏
  # 全程按住普攻：Q → R → 强化重击 ×2 → (E → 强化重击) ×2；最后一下重击命中后 F 处决（谐度破坏按缺省自动）
  - 景燃 Q 大招 阳重击 阴A1 阴A2 阴A3 阴A4 阴重击 阳E1 阳E2 阳重击 阴E1 阴E2 阴重击 阳A1~ 阳A2~   # 协奏差一点就补普攻（流程二的写法"处决后接普攻 ×1"）
  - switch 守岸人 变奏
  - 守岸人 A1 A2 A3 E-地面 A1 强化重击 Q 大招 A1~ A2~   # AAA E A Z Q R，大招后再点一下普攻
  - switch 尤诺 变奏
  - 尤诺 E2 Q 闪避 大招 跳跃-变弓 闪避 强化弓A1 强化弓A2 强化弓A3 强化E3 强化E3 至臻完满   # E+Q 闪 R 跳 闪 AAA EE Z
options: { repeat: 6, maxFrames: 60000 }
