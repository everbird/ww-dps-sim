initial: { onField: 0 }               # 椿先上；能量缺省满（开场维里奈、散华就放大招）、协奏 0
opening:
  - 椿 A1 A2 E1                        # 椿AAE：白椿两下，E 进盛绽（红椿）
  - switch 散华
  - 散华 E R 重击居合                    # 散ERZ（原文写 EZR，见开头）
  - switch 维里奈
  - 维里奈 A3-地面出场技 A4 A5 E Q R      # 维AAAEQR：普通切人入场按 A 是地面出场技（A3 组里那一行），再按 A 接 A4、A5（2026-10-18 用户确认）
  - 维里奈 跳跃 强化空中A1 强化空中A2 强化空中A3   # 跳AAA
  - switch 椿                           # 维里奈协奏满 → 椿变奏
  - 椿 盛绽·A1 盛绽·A2 盛绽·A3 盛绽·A4 盛绽·A1 E2   # AAAAAE：还在红椿 → 蔓舞 5 下，E2 退盛绽
  - switch 散华                         # "5"
  - 散华 E Q                           # 散EQ（原文写 AQ，2026-10-20 用户确认是 E：这时 E 已冷却，见开头）
  - switch 椿 变奏                      # 原文"散AQ变奏椿"：这里应是变奏（协奏没满会警告）
  - 椿 大招 E3 E1 盛绽·A3循环聚怪 Q           # REEZQ：白椿放大招，一日花，E 回红椿，长按烬华蔓舞，无冠者
  - 椿 盛绽·闪避 盛绽·A1 盛绽·A2 盛绽·A3 E2 Q   # 闪AAAEQ：红椿里闪避、蔓舞三下，E 退盛绽，无冠者
rotation:
  - switch 散华                         # 椿→
  - 散华 E R 重击居合                    # 散ERZ（原文写 EZR，见开头）
  - switch 维里奈
  - 维里奈 A3-地面出场技 A4 A5 E          # 维AAAE：Q 挪到第二次上场（见开头）
  - switch 椿
  - 椿 A2-地面出场技 E1                 # 椿AE：普通切人入场按 A 是地面出场技（就是 A2，2026-10-18 用户实测），E 进盛绽
  - switch 维里奈
  - 维里奈 大招 跳跃 Q 强化空中A1 强化空中A2 强化空中A3   # 维R跳 Q AAA：无归的谬误挪到这里（轴搜索第一名）
  - switch 椿
  - 椿 盛绽·A1 盛绽·A2 盛绽·A3 盛绽·A4 盛绽·A1 E2   # AAAAAE
  - switch 散华                         # "5"
  - 散华 E Q                           # 散EQ（原文写 AQ，2026-10-20 用户确认是 E：这时 E 已冷却，见开头）
  - switch 椿 变奏                      # 原文"散AQ变奏椿"：这里应是变奏（协奏没满会警告）
  - 椿 大招 E3 E1 盛绽·A3循环聚怪 Q           # REEZQ
  - 椿 盛绽·闪避 盛绽·A1 盛绽·A2 盛绽·A3 E2 Q   # 闪AAAEQ
options: { repeat: 4, maxFrames: 15000 }
