# 椿散维教学轴（EQ 版）· 维里奈的 Q 挪后（2026-10-21）：与 m0-video-eq.yaml 只差一处——循环轴里维里奈的无归的谬误（Q）
#   不在第一次上场"维AAAEQ"放，挪到第二次上场"维R跳AAA"的跳跃之后、强化空中A1 之前。启动轴不动。
#   来源：轴搜索 pnpm search scenarios/m0-video-eq.yaml（只挪 Q，第一名，TD-10 §6.1）。是"游戏里也该更好"的假设，要进游戏核对（m0-confirm §14 D1）：
#   pnpm compare scenarios/m0-video-eq.yaml scenarios/m0-video-eq-维里奈Q后移.yaml 看差多少。
# 以下是 m0-video-eq.yaml 的说明：
# 椿散维教学轴（EQ 版）：B 站 BV1VBja6sErw「本质轮椅！椿散维五花25s循环轴」（暗羽kkk，2026-06-18）简介里的启动轴与循环轴。
# 原文（用户用 Gemini 对过视频，与视频一致）：
#   启动轴：椿AAE→散EZR→维AAAEQR跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
#   循环轴：椿→散EZR→维AAAEQ→椿AE→维R跳AAA→椿AAAAAE5散AQ→椿REEZQ闪AAAEQ
# 记号：A 普攻、E 共鸣技能、Z 长按攻击、Q 声骸、R 大招、跳、闪、→ 切人；"5" 是漏打的 →（2026-10-04 用户确认）。
# 这一份是 EQ 版，以它为准（2026-10-18 用户推测，2026-10-20 用户确认，m0-confirm §11 V7）：原文的"散AQ变奏椿"其实是"散EQ变奏椿"——
#   散华的 E 这时已经冷却，作者在视频里 AQ、EQ 常说混。按原文 AQ 的一版留在 m0-video.yaml（对照用）。按 EQ 跑的结果（20261003 版数据）：
#   · E 冷却 10 秒（从出手起按战斗时间算，TD-04 §6.5）都赶得上：启动轴两次 E 隔 10.80 秒（只多 0.8 秒，最紧）；稳态轮首 E 到散EQ 的 E
#     隔 12.77 秒，散EQ 的 E 到下一轮轮首 E 隔 12.23 秒。排程没因此多等。
#   · 每次"散EQ→椿"都是变奏（启动轴那次也是，散华协奏都满）；散华切维里奈一直是普通切人（上一轮 EQ 的冰棱在后台自爆，给了 15 协奏，
#     切出时 76）；一日花前协奏都够，不用补 A。稳态每轮仍是 25.00 秒：散华多站的 0.45 秒被椿等 E1 冷却、维里奈等大招冷却的空档抵掉。
#   · 第 3 轮 DPS 41,164（AQ）→ 42,511（+3.3%），整个窗口 37,963 → 42,141（2026-10-19 的数；10-20 散华重击按住半秒后稳态 41,192 → 42,475，+3.1%）。+3.3% 里：第二下 E 本身（E 命中 12,083、冰棱自爆 3,320）；
#     6 链覆盖变长约 19,000（这块冰棱没人引爆，5 链让它约 5.7 秒后自爆，这一爆也触发 6 链"全队攻击 +10%"，一直盖到下一轮开头；
#     5 链自爆算 6 链说的"引爆"，2026-10-18 用户实测，m0-confirm §11 V8）；椿AE 的 E1 多一段吃到散华延奏带的无常凶鹭、轻云出月
#     +1,317；少了地面出场技 −2,164。
#   · 视频里的字幕"协奏不够多a一下"说的是一日花之后、启动轴末尾的 A 连段（2026-10-20 用户说明，V9），不重要、不加。
#   两处 switch 椿 同样写成"switch 椿 变奏"（TD-09 §3.5），这一版不会警告。其余说明与 m0-video.yaml 相同。
# 散华按 ERZ 打（2026-10-18 用户指出）：原文与 Gemini 核对的都是 EZR，但 R 放在最后不对——先 E、R，再重击居合，一次把冰棘（变奏）、
#   冰棱（E）、冰川（R）一起引爆，6 链两层攻击一次叠满，4 链"放大招后 5 秒内的下次重击爆裂 +120%"也吃得到（同 m0-team.yaml；能量论举的
#   例子也是"实战erz"）；EZR 时冰川要等 5 链"消失时直接爆炸"（6.5 秒后）。
#   重击一松手就切维里奈（重击爆裂先按住半秒、松手前不能切，2026-10-20，m0-confirm §13 P1、P5）：切人不打断重击（TD-05 §2；能量论"切人，
#   该角色仍然会在场上打完技能"），引爆在后台打中，切人时散华协奏只有 76（上一轮冰棱自爆给的 15 在内），维里奈不是变奏；协奏在后台满 100，留到"散EQ→椿"，
#   散华的延奏、轻云出月、无常凶鹭都给椿——"散EQ→椿"就是为这个排的（2026-10-18 用户判断；后台命中给的协奏算不算，用户待查证）。
#   这样稳态每轮正好 25 秒：维里奈、椿的大招冷却都是 25 秒，维里奈的大招还要等 42 帧冷却（2026-10-20 核对，pnpm insight ④；
#   按住半秒之前是 72 帧）。若等引爆打中再切（维里奈变奏），每轮 25.80 秒、超过冷却，稳态 DPS 低 22%（散华的延奏落在维里奈身上；2026-10-18 算的）。
# 推演按 m0-confirm §6 C1（切人不退出盛绽，用户再次确认）："AAE / AE"的 E1 进红椿后，到 AAAAAE 之前没有退出盛绽的操作
#   （只有黯蕊猎心、控物、旋舞会退），所以 AAAAA 是蔓舞、E 是 E2。这样变奏拿到的 100 点红椿·蕊只耗掉 81.9；2026-10-04 按当时的轴推，
#   走到"椿REE"时协奏不到 100（开局蕊按 0），一日花放不出来。现在"散EQ→椿"每次都是变奏入场，协奏够了（见上）。
# 一日花前原来按字幕"协奏不够多a一下"写了补位"A1~ A2~"（TD-09 §3.2，m0-confirm §11 V2）；2026-10-20 用户说明字幕说的是一日花之后、
#   启动轴末尾的 A 连段（V9；不重要、不加，视频给的未必靠谱），而两版的补位都一次也用不上（2026-10-19 行进序曲按阶回协奏之后），去掉了，结果不变。
# 20261003 版数据：散华"大招-引爆冰川"给协奏（20260707 版不给）。按 ERZ 重击出手就切、EQ：散华切维里奈每轮都是
#   普通切人，"散EQ→椿"每轮都是变奏（见上）。
# 开局椿的红椿·蕊按 0（2026-10-05 用户确认）。
# 按键 → 动作（2026-10-04 用户说明；椿的白椿 / 红椿按规则推：E1 进红椿，E2 / 盛绽跳跃回白椿，切人不改，一日花不改颜色，
# 协奏满且一日花不在冷却时 E 自动是一日花）：
#   椿：AAE = 白椿两下 + E1 进盛绽（开局就在场上，不是入场）；AE（普通切人入场）= 地面出场技（就是 A2，2026-10-18 用户实测，
#       xlsx 没写，m0-confirm §11 V10）+ E1；AAAAAE = 蔓舞 5 下（4 段后重新起手）+ E2 退盛绽；REE = 白椿放大招、E3 一日花、E1 回红椿；
#       Z = 长按（红椿里是烬华蔓舞）；闪 = 盛绽闪避；红椿里的 A 是蔓舞
#   散华：Z = 重击居合
#   维里奈：AAA（普通切人入场）= 地面出场技（A3 组里那一行）+ A4 + A5（2026-10-18 用户确认，m0-confirm §11 V10）；
#       跳AAA = 强化空中攻击（星星花绽放）
# 配装：视频只给了声骸配置的硬性指标；椿的首位换成梦魇·无冠者后都满足，其余沿用 m0-team.yaml、不用调整（2026-10-05 用户确认）。
