enemy: { preset: 全息6/无常凶鹭 }
initial: { onField: 2 }               # 守岸人先上；能量缺省满、协奏 0
opening:
  - 守岸人 A1 A2 A3 A4 强化重击 A1 A2 A3 A4 强化重击 Q 大招 E-地面   # AAAA Z AAAA Z Q R E（实论数据满 5 段时 Z 是演绎；E 写 E-地面，见守岸人模块）
  - wait 60                          # 等黯星·蝶命中、协奏才满（不等就差约 8 点，切过去不是变奏；jys-confirm X1）
rotation:
  - switch 尤诺 变奏
  # E（告终的喧响）Q 闪避 R 跳（流变·月弓）E E（越限的弦引）A Z（至臻的完满）。A 是月弓三段（2026-10-24 用户确认，jys-confirm X2）：
  # 只打一段时到 Z 前协奏约 86（xlsx 与 WuwaLAB 一致），至臻的完满要满 100；三段正好用完大招后的 100 灵性
  - 尤诺 E2 Q 闪避 大招 跳跃-变弓 强化E3 强化E3 强化弓A1 强化弓A2 强化弓A3 至臻完满
  - switch 景燃 变奏
  # 原文 R ZZ E Z E Z Q。Z 是一直按住普攻（2026-10-24 用户说明）：先打普攻连段，炁满 300、强化重击亮起时自动打出；
  # E 后按住是先出空中的往生送 / 黄泉渡（+100 炁），炁满了再接重击。按数据一轮正好 4 下重击（命火 100 每下 25、行途返 3 次）：
  # R（炁 300）→ 踏罡（剩 200）→ 阴 A1–A4（+100）→ 劫魄 → 阳焚身、往生送 → 踏罡 → 阴蚀骨、黄泉渡 → 劫魄（jys-confirm X3）
  - 景燃 大招 阳重击 阴A1 阴A2 阴A3 阴A4 阴重击 阳E1 阳E2 阳重击 阴E1 阴E2 阴重击 Q
  - switch 守岸人 变奏
  - 守岸人 A1 A2 A3 E-地面 A1 A2 A3 强化重击 Q 大招                    # （变奏是洞悉）AAA E AAA Z Q R
options: { repeat: 6, maxFrames: 60000 }
