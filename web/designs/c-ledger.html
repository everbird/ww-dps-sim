<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间轴 · C 指令表格</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* C 指令表格：以排轴为主线，一行一条指令（就是你写的轴），文字与数字永远完整可读；最后一列是这一轮的甘特条，
     等待画成条前的斜纹。对"这条轴哪里慢、慢在哪条"最直接；全局的 buff、资源只给精简的小结 */
  :root {
    --paper: #f5f6f8; --panel: #ffffff; --ink: #1b2230; --muted: #5a6376; --faint: #8f97a7; --rule: #dadfe7; --grid: #eef0f4; --row: #fafbfc;
    --alert: #c8323b; --wait: #c47f1c; --good: #2f8a5b; --focus: #2a78bb;
    --el-havoc: #a32f6c; --el-glacio: #2a78bb; --el-spectro: #a98410; --el-fusion: #c9512a; --el-electro: #7547cf; --el-aero: #23977a; --el-physical: #677084;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1117; --panel: #151a22; --ink: #e4e8ef; --muted: #a0a8b8; --faint: #6f7889; --rule: #29303c; --grid: #1d232c; --row: #181e27;
      --alert: #ef5a62; --wait: #e2a446; --good: #4fb47f; --focus: #5aa5e8;
      --el-havoc: #d6619e; --el-glacio: #5aa5e8; --el-spectro: #d9b443; --el-fusion: #e9784f; --el-electro: #a07df0; --el-aero: #4cc3a2; --el-physical: #98a1b5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); padding: 20px 16px 40px; }
  .wrap { max-width: 1500px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 21px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font: 500 17px var(--mono); }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }
  .strip { padding: 12px 14px; display: grid; gap: 6px; }
  .seg { position: relative; height: 26px; border-radius: 4px; overflow: hidden; background: var(--grid); }
  .seg div { position: absolute; top: 0; bottom: 0; background: var(--c); color: #fff; font-size: 12px; padding: 4px 6px; white-space: nowrap; overflow: hidden; border-right: 2px solid var(--panel); }
  .scale { position: relative; height: 16px; font: 11px var(--mono); color: var(--muted); }
  .scale span { position: absolute; transform: translateX(-50%); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th { white-space: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 1; text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--rule); }
  td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  @media (hover: hover) { tbody tr:hover td { background: var(--row); } }
  th.n { text-align: right; }
  td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.line { font-family: var(--mono); color: var(--faint); white-space: nowrap; }
  td.cmd { white-space: nowrap; }
  td.cmd .who { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 1px; }
  tr.sw td.cmd { font-weight: 500; }
  tr.sub td { color: var(--muted); }
  td.why { color: var(--muted); font-size: 12px; min-width: 26ch; }
  /* 表格在自己的框里滚动：横向放得下「之前卡在」，纵向表头吸顶 */
  .tablewrap { overflow: auto; max-height: max(420px, 78vh); }
  .tablewrap table { min-width: 980px; }
  td.why b { color: var(--muted); font-weight: 400; font-family: var(--mono); }
  td.why .hot { color: var(--ink); }
  td.why .hot b { color: var(--wait); font-weight: 500; }
  td.gantt { width: 34%; min-width: 240px; padding: 0 8px; }
  .g { position: relative; height: 18px; overflow: hidden; }
  .g .bar { position: absolute; top: 3px; height: 12px; border-radius: 2px; background: var(--c); }
  .g .w { position: absolute; top: 3px; height: 12px; background: repeating-linear-gradient(135deg, var(--wait) 0 3px, transparent 3px 6px); opacity: .75; }
  .g .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
  .g .dia { position: absolute; top: 2px; width: 10px; height: 10px; transform: translateX(-5px) rotate(45deg); background: var(--c); }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { .side { grid-template-columns: minmax(0, 1fr); } td.gantt, th#gh { display: none; } .tablewrap table { min-width: 560px; } }
  @media (max-width: 640px) { body { padding: 14px 10px 32px; } h1 { font-size: 18px; } .row { gap: 6px 18px; } .v { font-size: 15px; } }
  /* 触摸屏：下拉框够大好点；字号 16px，iPhone 聚焦时才不自动放大页面 */
  @media (pointer: coarse) { select { min-height: 34px; font-size: 16px; } }
  .side h2 { font-size: 14px; margin: 0 0 8px; }
  .up { display: grid; grid-template-columns: minmax(0, 14ch) minmax(0, 1fr) 6ch; gap: 3px 10px; font-size: 12.5px; align-items: center; }
  .up span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up i { display: block; height: 8px; border-radius: 2px; background: var(--c); }
  .up em { font: 11.5px var(--mono); font-style: normal; color: var(--muted); text-align: right; }
  .pad { padding: 12px 14px; }
  [data-tip] { cursor: default; }
  .ww-tip { position: fixed; z-index: 10; max-width: min(380px, calc(100vw - 16px)); pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 6px; box-shadow: 0 6px 20px rgba(10, 16, 28, 0.18); padding: 8px 10px; font-size: 12px; line-height: 1.55; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:10px">
    <h1 id="title"></h1>
    <div class="row"><label class="k">轮次 <select id="loopSel"></select></label><div class="row" id="kpi"></div></div>
  </header>
  <section class="card strip"><div class="k">谁在前台（每段多长，世界秒）</div><div class="seg" id="seg"></div><div class="scale" id="scale"></div></section>
  <section class="card tablewrap">
    <table>
      <thead><tr><th>条</th><th>指令</th><th class="n">开始·战斗秒</th><th class="n">到下一条</th><th class="n">伤害</th><th class="n">协奏</th><th class="n">能量</th><th>之前卡在</th><th id="gh">本轮时间线</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </section>
  <div class="side">
    <section class="card pad"><h2>buff 覆盖（本轮，影响伤害的）</h2><div class="up" id="uptime"></div></section>
    <section class="card pad"><h2>本轮伤害（按引发的动作）</h2><div class="up" id="byact"></div></section>
  </div>
</div>
<script id="timeline-data" type="application/json">null</script>
<script>/*@shared*/</script>
<script>
(() => {
  const M = WW.load(); if (!M) return
  WW.paint(M)
  const D = M.D, S = M.summary, $ = id => document.getElementById(id)
  $('title').textContent = `${M.team.map(t => t.name).join(' · ')}　${M.title}`
  const trace = M.trace.filter(t => t.commands.length)
  $('loopSel').innerHTML = trace.map(t => `<option value="${t.loop}">${WW.loopName(t.loop)}${S.steady && t.loop >= S.steady.from && t.loop <= S.steady.to ? '（稳态）' : ''}</option>`).join('')
  const colorOf = name => (D.slot.has(name) ? `var(--c${D.slot.get(name)})` : 'var(--faint)')

  function render() {
    const T = trace.find(t => String(t.loop) === $('loopSel').value) || trace[0]
    const sp = T.span, len = Math.max(1, sp.endF - sp.f)
    const pc = f => `${(100 * (f - sp.f)) / len}%`
    const pw = n => `${(100 * Math.max(0, n)) / len}%`
    const pl = (S.perLoop || []).find(p => p.loop === T.loop)
    $('kpi').innerHTML = [['世界秒', WW.sec(sp.endF - sp.f)], ['战斗秒', (sp.endT - sp.t).toFixed(2)], pl && ['本轮 DPS', WW.fmt(pl.dps)], pl && ['本轮伤害', WW.fmt(pl.damage)]]
      .filter(Boolean).map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')
    $('seg').innerHTML = T.segments.map(s => `<div style="--c:${colorOf(s.char)};left:${pc(s.f)};width:${pw(s.frames)}" data-tip="${WW.esc(`<b>${WW.esc(s.char)}</b> 在前台 ${WW.sec(s.frames)} 秒（世界秒）`)}">${WW.esc(s.char)} ${WW.sec(s.frames)}</div>`).join('')
    const marks = []
    for (let s = 0; s <= (sp.endF - sp.f) / 60; s += 5) marks.push(`<span style="left:${pc(sp.f + s * 60)}">${s}</span>`)
    $('scale').innerHTML = marks.join('')
    $('gh').textContent = `本轮时间线（${WW.sec(sp.endF - sp.f)} 世界秒）`
    const ticks = [...Array(Math.floor((sp.endF - sp.f) / 300) + 1).keys()].map(k => `<span class="tick" style="left:${pc(sp.f + k * 300)}"></span>`).join('')
    const actOf = c => (c.kind === 'act' || c.kind === 'interject'
      ? D.actions.find(a => a.cmd && a.cmd.loop === T.loop && a.cmd.line === c.line && a.cmd.item === c.item && a.start === c.f)
        || D.actions.find(a => !a.cmd && a.start === c.f && c.kind === 'interject') || null
      : null)
    // 这个动作给的协奏、能量（动作本人拿到的；整个动作的合计，含之后才命中的段）；提示里逐条列出处，给队友的也在里面
    const gainCells = a => {
      const g = a && a.gains
      if (!g || !g.items.length) return '<td class="n"></td><td class="n"></td>'
      const t = WW.gainTotals(M, g)
      const tip = WW.esc(`<b>${WW.esc(`${a.char} ${a.id}`)} 给的资源</b><br>` + g.items.map(it => `${WW.RES_NAME[it.resource] || it.resource} ${WW.esc(WW.whoGot(M, it.deltas, a.char))}　${WW.esc(WW.gainName(it))}${it.dt > 0 ? `（+${it.dt.toFixed(2)} 秒）` : ''}`).join('<br>'))
      const own = res => (t[res] && t[res][a.char] !== undefined ? WW.signedNum(t[res][a.char]) : '')
      return `<td class="n" data-tip="${tip}">${own('concerto')}</td><td class="n" data-tip="${tip}">${own('energy')}</td>`
    }
    $('body').innerHTML = T.commands.map(c => {
      const who = c.kind === 'switch' ? c.label.replace(/^switch\s+/, '').replace(/（.*$/, '') : c.label.replace(/^（[^）]*）/, '').split(' ')[0]
      const wait = c.waits.reduce((a, w) => a + w.frames, 0)
      // 派生窗口、优先级是正常出招节奏（淡色）；冷却、资源、等出手、切人冷却等是真正卡住（高亮）
      const why = c.waits.map(w => `<span class="${/派生窗口|优先级/.test(w.reason) ? '' : 'hot'}">${WW.esc(w.reason)} <b>${w.frames}</b></span>`).join('；')
      const text = c.line !== null ? WW.cmdText(M, { loop: T.loop, line: c.line }) : ''
      const act = actOf(c), d = act ? act.damage : 0
      const g = c.kind === 'switch'
        ? `<span class="dia" style="--c:${colorOf(who)};left:${pc(c.f)}"></span>`
        : `${wait ? `<span class="w" style="left:${pc(Math.max(sp.f, c.f - wait))};width:${pw(Math.min(wait, c.f - sp.f))}"></span>` : ''}<span class="bar" style="--c:${colorOf(who)};left:${pc(c.f)};width:${pw(Math.max(c.frames, 2))};opacity:${c.kind === 'skip' ? 0.25 : 1}"></span>`
      // 写了"变奏"的切人没变奏：这一行标红，原因写在"之前卡在"一栏（TD-12 §2.1）
      const al = c.kind === 'switch' ? D.alerts.find(a => a.cmd && a.cmd.loop === T.loop && a.cmd.line === c.line && a.cmd.item === c.item) : null
      const cls = (c.kind === 'switch' ? 'sw' : c.kind === 'skip' || c.kind === 'interject' ? 'sub' : '') + (al ? ' ww-alert' : '')
      return `<tr class="${cls}"><td class="line">${c.line === null ? '' : `${c.line}.${c.item}`}</td><td class="cmd"${text ? ` data-tip="${WW.esc(`<b>${c.line === null ? '' : `第 ${c.line} 条：`}</b>${WW.esc(text)}`)}"` : ''}><span class="who" style="--c:${colorOf(who)}"></span>${WW.esc(c.label)}</td>
        <td class="n">${(c.t - sp.t).toFixed(2)}</td><td class="n">${WW.sec(c.frames)}</td><td class="n"${d ? ` data-tip="${WW.esc(WW.dmgTip(act))}"` : ''}>${d ? WW.fmt(d) : ''}</td>${gainCells(act)}<td class="why">${al ? `<span class="ww-alert-text">${WW.esc(WW.alertBody(al))}</span>${why ? '；' : ''}` : ''}${why}</td>
        <td class="gantt"><div class="g">${ticks}${g}</div></td></tr>`
    }).join('')
    // buff 覆盖：本轮内（世界帧）的覆盖比例，只列影响伤害的，按受益人分色
    const ups = D.buffs.filter(b => b.damage).map(b => {
      let on = 0; for (const s of b.spans) on += Math.max(0, Math.min(s.end, sp.endF) - Math.max(s.start, sp.f))
      return { b, u: on / len }
    }).filter(x => x.u > 0).sort((a, b) => b.u - a.u).slice(0, 16)
    $('uptime').innerHTML = ups.map(({ b, u }) => `<span data-tip="${WW.esc([`<b>${WW.esc(b.buff)}</b> → ${WW.esc(b.target)}`, WW.buffEffect(M, b.buff), (M.buffInfo[b.buff] || {}).source].filter(Boolean).map((t, k) => (k ? WW.attr(t) : t)).join('<br>'))}">${WW.esc(b.short)} → ${WW.esc(b.target)}</span><i style="--c:${colorOf(b.target)};width:${(u * 100).toFixed(1)}%"></i><em>${WW.pct(u)}</em>`).join('')
    const acts = new Map()
    // 按引发的动作合计（同上面的伤害列，TD-12 §2.1）；按命中时刻算进本轮，合计同本轮伤害
    for (const h of D.hits) if (h.dmg && h.f >= sp.f && h.f < sp.endF) { const k = `${h.char} ${h.ownerAct}`; acts.set(k, (acts.get(k) || 0) + h.dmg.expected) }
    const top = [...acts].sort((a, b) => b[1] - a[1]).slice(0, 12), mx = top.length ? top[0][1] : 1
    $('byact').innerHTML = top.map(([k, v]) => `<span>${WW.esc(k)}</span><i style="--c:${colorOf(k.split(' ')[0])};width:${(100 * v / mx).toFixed(1)}%"></i><em>${WW.fmt(v / 1000)}k</em>`).join('')
  }
  $('loopSel').addEventListener('change', render)
  // 提示条（写了"变奏"的切人没变奏）：点一条换到那一轮，滚到那一行
  WW.mountAlerts(M, document.querySelector('.wrap'), a => {
    if (!a.cmd || !trace.some(t => t.loop === a.cmd.loop)) return
    $('loopSel').value = String(a.cmd.loop); render()
    const tr = document.querySelector('tr.ww-alert'); if (tr) tr.scrollIntoView({ block: 'center', behavior: 'smooth' })
  }, document.querySelector('.wrap > section'))
  WW.tips(document.body)
  const first = WW.defaultLoop(M)
  if (first != null && trace.some(t => t.loop === first)) $('loopSel').value = String(first)
  render()
})()
</script>
</body>
</html>
