# C9：散华 E 的协奏是起手即得还是命中才给（DD-08 §5；用户 2026-11-27 同意登记）。进游戏实验，实验页 docs/experiments/C9-散华E协奏起手即得.md。
# 用 C8 回填看到的现象来分：声骸能在 E 出伤前把 E 打断（E 进冷却、冰棱不出现），这时 E 的那一下命中根本没有。
