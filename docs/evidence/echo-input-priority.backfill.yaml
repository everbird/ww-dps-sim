notes: 回填的意义：确认声骸起手能打断 E（不必等 E 结束），而且打断时 E 没生成的判定作废——后一半正是 wait-settled 的约定（抢帧丢判定）。轴里写 E Q 时调度器缺省等 E 的判定出手再按 Q（打法，不丢 E 的伤害与散华的冰棱），这次没测"出伤后马上按 Q 多快出"；按数据 E 出伤后的优先级不比出伤前高，同一条规则下也能马上出。肉眼只给上界，几帧的差别（等不等出手）量不出来。
