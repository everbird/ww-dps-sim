# 回填（DD-08 §6）：声骸起手的优先级。材料是用户 2026-11-26 在 iPad 上照 C8 的操作做的一次（没录像，肉眼看）：E 一起手就按 Q，声骸立刻起手、
# E 被打断（散华的冰棱不再出现，E 进了冷却），维里奈、椿也一样。接替作废的 echo-input-priority.2026-11（那条的 setup 是"等出手再按"，与操作对不上）。
# 观测 docs/calibration/points.yaml 的 声骸起手.*抢帧，记录 docs/experiments/C8-声骸起手优先级.md 的"结果"。
# runs / predictions 由 pnpm evidence predict 写，verdicts / conclusion 由 judge 写，reruns 由 rerun 写；其余是人写的。
id: echo-input-priority.backfill
propositionId: echo-input-priority
question: E 一起手（出伤前）就按首位声骸，声骸是马上起手、把 E 打断（E 没生成的判定作废），还是要等 E 结束或进同级派生窗口才出
